name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      gate:
        description: Test gate to run
        required: true
        default: pr-check
        type: choice
        options:
          - pr-check
          - l0-l2
          - nano-core-e2e
          - web-e2e
          - smoke
          - release-gate
          - full

      candidate_tag:
        description: Intended prerelease with a committed unused notes input; empty selects the sole pending input
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Image bootstrap steps run as root against a checkout the runner user owns, so git refuses the
# repository as dubiously owned. `actions/checkout` declares the exception only under a temporary
# HOME its own steps use, which no later step reads. Declaring it here reaches every job's steps.
# The value is the in-container checkout path rather than `*`, which would disable git's ownership
# check for every repository the runner can reach.
# See the Test Execution Environment decision in docs/toolchain.md.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: /__w/openkit/openkit

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'openkit-release' || format('openkit-ci-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # Every any-placed gate below runs inside this image. Admitted host leaves use
  # their named non-container jobs. The image is authoritative for any placement;
  # its tag is a digest of the build inputs, so a tree cannot be tested against an
  # image built from a different Dockerfile.
  # See the Test Execution Environment decision in docs/toolchain.md.
  test-image:
    name: Test execution image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.immutable.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve expected image identity from containers/images.json
        id: expected
        run: |
          image_tag="$(node scripts/docker/test-image-tag.mjs --owner "${GITHUB_REPOSITORY_OWNER}")"
          build_input_digest="$(node scripts/docker/test-image-tag.mjs --digest)"
          context="$(node scripts/docker/test-image-tag.mjs --field context)"
          dockerfile="$(node scripts/docker/test-image-tag.mjs --field dockerfile)"
          platforms="$(node scripts/docker/test-image-tag.mjs --field platforms)"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "build_input_digest=${build_input_digest}" >> "${GITHUB_OUTPUT}"
          echo "context=${context}" >> "${GITHUB_OUTPUT}"
          echo "dockerfile=${dockerfile}" >> "${GITHUB_OUTPUT}"
          echo "platforms=${platforms}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the expected image is already published
        id: published
        env:
          EXPECTED_BUILD_INPUT_DIGEST: ${{ steps.expected.outputs.build_input_digest }}
          IMAGE_TAG: ${{ steps.expected.outputs.image_tag }}
        run: |
          if docker pull "${IMAGE_TAG}" >/dev/null 2>&1 \
            && [ "$(docker image inspect --format '{{ index .Config.Labels "org.openkit.test-env.build-input-digest" }}' "${IMAGE_TAG}")" = "${EXPECTED_BUILD_INPUT_DIGEST}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Docker Buildx
        if: steps.published.outputs.present == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish the test execution image
        if: steps.published.outputs.present == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.expected.outputs.context }}
          file: ${{ steps.expected.outputs.dockerfile }}
          platforms: ${{ steps.expected.outputs.platforms }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENKIT_TEST_IMAGE_BUILD_INPUT_DIGEST=${{ steps.expected.outputs.build_input_digest }}
          tags: ${{ steps.expected.outputs.image_tag }}

      - name: Resolve immutable test image reference
        id: immutable
        env:
          EXPECTED_BUILD_INPUT_DIGEST: ${{ steps.expected.outputs.build_input_digest }}
          IMAGE_TAG: ${{ steps.expected.outputs.image_tag }}
        run: |
          docker pull "${IMAGE_TAG}"
          actual_build_input_digest="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.openkit.test-env.build-input-digest" }}' \
              "${IMAGE_TAG}"
          )"
          if [ "${actual_build_input_digest}" != "${EXPECTED_BUILD_INPUT_DIGEST}" ]; then
            echo "Published test image has the wrong build-input digest label." >&2
            exit 1
          fi

          image="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "${IMAGE_TAG}")"
          image_repository="${IMAGE_TAG%:*}"
          case "${image}" in
            "${image_repository}@sha256:"*) ;;
            *)
              echo "Published test image did not resolve to an OCI digest." >&2
              exit 1
              ;;
          esac
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

  pr-check:
    name: PR lightweight repo check
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.gate == 'pr-check')
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.test-image.outputs.image }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lightweight repository check
        run: pnpm -w check:repo

  nanohost-installer:
    name: NanoHost installer fixed-path gate
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bubblewrap prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap slirp4netns
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the isolated fixed-path installer gate
        run: bash tests/support/nanohost-release-installer-live.sh

  release-preflight:
    name: Release preflight
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.test-image.outputs.image }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch main ref
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate release identity and assets
        run: |
          node scripts/release-preflight.mjs \
            --tag "${GITHUB_REF_NAME}" \
            --repo-root . \
            --sha "${GITHUB_SHA}" \
            --main-ref origin/main \
            --require-main

      - name: Check release notes input
        run: node scripts/release-notes.mjs --check --repo-root . --tag "${GITHUB_REF_NAME}"

  l0-l2-plan:
    name: L0-L2 shard inventory
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["l0-l2","release-gate","full"]'), inputs.gate))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Derive complete deterministic owners
        id: plan
        run: echo "matrix=$(node scripts/ci-l0-l2.mjs --matrix)" >> "${GITHUB_OUTPUT}"

  l0-l2-shards:
    name: L0-L2 shard (${{ matrix.id }})
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["l0-l2","release-gate","full"]'), inputs.gate))
    needs: [test-image, l0-l2-plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.l0-l2-plan.outputs.matrix) }}
    container:
      image: ${{ needs.test-image.outputs.image }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reuse exact-commit candidate shard
        id: reuse
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD_ID: ${{ matrix.id }}
        run: |
          if proof="$(node scripts/release-ci-reuse.mjs --repository "${GITHUB_REPOSITORY}" --workflow ci.yml --sha "${GITHUB_SHA}" --job "L0-L2 shard (${SHARD_ID})")"; then
            echo "reused=true" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "${proof}" >> "${GITHUB_STEP_SUMMARY}"
            mkdir -p temp/ci-shards
            PROOF="${proof}" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(`temp/ci-shards/${process.env.SHARD_ID}.json`, JSON.stringify({id: process.env.SHARD_ID, conclusion: 'success', reuse: process.env.PROOF}));
          NODE
          else
            echo "reused=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Cache pnpm store
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - name: Cache locked build inputs and outputs
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .turbo
            target
            apps/nanohost/target
            /usr/local/cargo/registry
            /usr/local/cargo/git
            ~/.cache/openkit/lindera
          key: l0-l2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.id }}-${{ hashFiles('pnpm-lock.yaml', '**/Cargo.lock', '**/mise.toml', '.mise.toml', 'scripts/retrieval-*', 'containers/test-env/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            l0-l2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.id }}-${{ hashFiles('pnpm-lock.yaml', '**/Cargo.lock', '**/mise.toml', '.mise.toml', 'scripts/retrieval-*', 'containers/test-env/Dockerfile') }}-
      - name: Install dependencies
        if: steps.reuse.outputs.reused != 'true'
        run: pnpm install --frozen-lockfile
      - name: Run one complete shard as the unprivileged image user
        if: steps.reuse.outputs.reused != 'true'
        env:
          SHARD_ID: ${{ matrix.id }}
        run: |
          chown -R node:node "${GITHUB_WORKSPACE}" "${HOME}" "/pnpm/store" "/usr/local/cargo" "/usr/local/rustup"
          runuser -u node -- env HOME="${HOME}" node scripts/ci-l0-l2.mjs --run "${SHARD_ID}"
      - name: Retain successful shard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l0-l2-${{ matrix.id }}
          path: temp/ci-shards/
          if-no-files-found: error

  l0-l2:
    name: L0-L2 static, unit, contract
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["l0-l2","release-gate","full"]'), inputs.gate)))
    needs: [l0-l2-plan, l0-l2-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard job
        env:
          PLAN_RESULT: ${{ needs.l0-l2-plan.result }}
          SHARDS_RESULT: ${{ needs.l0-l2-shards.result }}
        run: test "${PLAN_RESULT}" = success && test "${SHARDS_RESULT}" = success
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download complete shard observations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: l0-l2-*
          merge-multiple: true
          path: temp/ci-shards
      - name: Require exactly one successful observation per shard
        run: node scripts/ci-l0-l2.mjs --join temp/ci-shards

  nano-core-e2e:
    name: L3 NanoCore e2e
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["nano-core-e2e","release-gate","full"]'), inputs.gate))
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
    container:
      image: ${{ needs.test-image.outputs.image }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reuse exact-commit candidate job
        id: reuse
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_JOB_NAME: L3 NanoCore e2e
        run: |
          if proof="$(node scripts/release-ci-reuse.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow ci.yml \
            --sha "${GITHUB_SHA}" \
            --job "${REUSE_JOB_NAME}")"; then
            echo "reused=true" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "${proof}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "reused=false" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "${proof}"
          fi

      - name: Cache pnpm store
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        if: steps.reuse.outputs.reused != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run NanoCore black-box e2e
        if: steps.reuse.outputs.reused != 'true'
        run: pnpm -w test:e2e:nano

  workspace-portability-source:
    name: Workspace portability source
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["nano-core-e2e","release-gate","full"]'), inputs.gate))
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.test-image.outputs.image }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NanoCore
        run: pnpm --filter @openkit/nanocore... build

      - name: Produce the portable Workspace archive
        run: pnpm --filter @openkit/nanocore exec tsx e2e/workspace-portability-ci.ts source ../../temp/ci-workspace-portability

      - name: Upload the portable Workspace archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-portability-source
          path: temp/ci-workspace-portability/
          if-no-files-found: error

  workspace-portability-target:
    name: Workspace portability target
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["nano-core-e2e","release-gate","full"]'), inputs.gate))
    needs:
      - test-image
      - workspace-portability-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.test-image.outputs.image }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NanoCore
        run: pnpm --filter @openkit/nanocore... build

      - name: Download the portable Workspace archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workspace-portability-source
          path: temp/ci-workspace-portability

      - name: Import and verify the portable Workspace archive
        run: pnpm --filter @openkit/nanocore exec tsx e2e/workspace-portability-ci.ts target ../../temp/ci-workspace-portability

  web-e2e:
    name: L4 Web e2e
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["web-e2e","full"]'), inputs.gate)
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.test-image.outputs.image }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web browser e2e
        run: pnpm -w test:e2e:web

      - name: Upload Web Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  smoke:
    name: L5 smoke
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["smoke","release-gate","full"]'), inputs.gate))
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.test-image.outputs.image }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run built-artifact smoke tests
        run: pnpm -w test:smoke

  app-image-admin-recovery:
    name: L5 app-image stopped-server recovery
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["smoke","release-gate","full"]'), inputs.gate))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned root Node toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: node

      - name: Build the disposable app image
        run: scripts/docker/build-image.sh app

      - name: Run the stopped-server recovery image smoke
        env:
          OPENKIT_TEST_APP_IMAGE_RECOVERY: "1"
        run: bash scripts/test-env.sh host node --test scripts/docker/app-admin-recovery-smoke.test.mjs

  build-nanohost-amd64:
    name: Build NanoHost natively on amd64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - release-preflight
      - nanohost-installer
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned NanoHost toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          working_directory: apps/nanohost
          install_args: rust

      - name: Build and inspect the pinned NanoHost binary
        run: |
          cd apps/nanohost
          cargo build --locked --release
          ./target/release/nanohost --version
          mkdir -p ../../nanohost-native
          cp target/release/nanohost ../../nanohost-native/nanohost

      - name: Upload native NanoHost binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanohost-native-amd64
          path: nanohost-native/nanohost
          if-no-files-found: error

  build-nanohost-arm64:
    name: Build NanoHost natively on arm64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - release-preflight
      - nanohost-installer
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned NanoHost toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          working_directory: apps/nanohost
          install_args: rust

      - name: Build and inspect the pinned NanoHost binary
        run: |
          cd apps/nanohost
          cargo build --locked --release
          ./target/release/nanohost --version
          mkdir -p ../../nanohost-native
          cp target/release/nanohost ../../nanohost-native/nanohost

      - name: Upload native NanoHost binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanohost-native-arm64
          path: nanohost-native/nanohost
          if-no-files-found: error

  package-release-assets:
    name: Package portable release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - test-image
      - release-preflight
      - l0-l2
      - nano-core-e2e
      - smoke
      - workspace-portability-target
      - build-nanohost-amd64
      - build-nanohost-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.test-image.outputs.image }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native NanoHost amd64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nanohost-native-amd64
          path: nanohost-native/amd64

      - name: Download native NanoHost arm64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nanohost-native-arm64
          path: nanohost-native/arm64

      - name: Resolve accepted OpenShell inputs
        id: openshell
        run: |
          node --input-type=module <<'NODE' >> "${GITHUB_OUTPUT}"
          import { readFileSync } from 'node:fs';
          import { parseOpenShellRelease } from './scripts/release-preflight.mjs';
          const release = parseOpenShellRelease(
            readFileSync('apps/nanohost/openshell/release.json', 'utf8')
          );
          process.stdout.write(`tag=v${release.version}\n`);
          process.stdout.write(`commit=${release.source.commit}\n`);
          process.stdout.write(`archive=${release.gateway.targets['linux/arm64'].archive.name}\n`);
          process.stdout.write(`amd64_archive=${release.gateway.targets['linux/amd64'].archive.name}\n`);
          NODE

      - name: Package and verify portable release assets
        env:
          OPENSHELL_AMD64_ARCHIVE: ${{ steps.openshell.outputs.amd64_archive }}
          OPENSHELL_ARCHIVE: ${{ steps.openshell.outputs.archive }}
          OPENSHELL_COMMIT: ${{ steps.openshell.outputs.commit }}
          OPENSHELL_TAG: ${{ steps.openshell.outputs.tag }}
        run: |
          mkdir -p nanohost-input
          # Use the image's built-in Node downloader; no extra tool installation is needed.
          node --input-type=module <<'NODE'
          import { createWriteStream } from 'node:fs';
          import { Readable } from 'node:stream';
          import { pipeline } from 'node:stream/promises';

          const { OPENSHELL_TAG, OPENSHELL_COMMIT, OPENSHELL_AMD64_ARCHIVE, OPENSHELL_ARCHIVE } = process.env;
          const inputs = [
            [
              OPENSHELL_AMD64_ARCHIVE,
              `https://github.com/NVIDIA/OpenShell/releases/download/${OPENSHELL_TAG}/${OPENSHELL_AMD64_ARCHIVE}`,
            ],
            [
              OPENSHELL_ARCHIVE,
              `https://github.com/NVIDIA/OpenShell/releases/download/${OPENSHELL_TAG}/${OPENSHELL_ARCHIVE}`,
            ],
            [
              'openshell-LICENSE',
              `https://raw.githubusercontent.com/NVIDIA/OpenShell/${OPENSHELL_COMMIT}/LICENSE`,
            ],
            [
              'openshell-THIRD-PARTY-NOTICES',
              `https://raw.githubusercontent.com/NVIDIA/OpenShell/${OPENSHELL_COMMIT}/THIRD-PARTY-NOTICES`,
            ],
          ];
          for (const [name, url] of inputs) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Release input download failed: ${response.status} ${url}`);
            await pipeline(Readable.fromWeb(response.body), createWriteStream(`nanohost-input/${name}`));
          }
          NODE
          node scripts/package-release-assets.mjs \
            --tag "${GITHUB_REF_NAME}" \
            --nanohost-amd64-binary nanohost-native/amd64/nanohost \
            --nanohost-arm64-binary nanohost-native/arm64/nanohost \
            --openshell-amd64-gateway-archive "nanohost-input/${OPENSHELL_AMD64_ARCHIVE}" \
            --openshell-arm64-gateway-archive "nanohost-input/${OPENSHELL_ARCHIVE}" \
            --openshell-license nanohost-input/openshell-LICENSE \
            --openshell-notices nanohost-input/openshell-THIRD-PARTY-NOTICES
          cd dist/release
          sha256sum -c SHA256SUMS
          tar -tzf "openkit-ops-skill-${GITHUB_REF_NAME}.tar.gz" | grep -Fx "openkit-ops-skill-${GITHUB_REF_NAME}/LICENSE"
          tar -tzf "openkit-ops-skill-${GITHUB_REF_NAME}.tar.gz" | grep -Fx "openkit-ops-skill-${GITHUB_REF_NAME}/skills/openkit-ops/SKILL.md"
          tar -tzf "openkit-ops-skill-${GITHUB_REF_NAME}.tar.gz" | grep -Fx "openkit-ops-skill-${GITHUB_REF_NAME}/skills/openkit-ops/scripts/openkit"
          ops_extract="$(mktemp -d)"
          OPS_ARCHIVE="openkit-ops-skill-${GITHUB_REF_NAME}.tar.gz" OPS_EXTRACT="${ops_extract}" node --input-type=module <<'NODE'
          import { verifyOperationsSkillArchive } from '../../scripts/package-release-assets.mjs';
          verifyOperationsSkillArchive({
            archivePath: process.env.OPS_ARCHIVE,
            destDir: process.env.OPS_EXTRACT,
          });
          NODE
          verification_parent="$(mktemp -d)"
          for architecture in amd64 arm64; do
            node ../../scripts/verify-nanohost-release.mjs \
              --archive "openkit-nanohost-${GITHUB_REF_NAME}-linux-${architecture}.tar.gz" \
              --checksum-file SHA256SUMS \
              --destdir "${verification_parent}/${architecture}" \
              --repo-root ../..
          done

      - name: Upload portable release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-portable-assets
          path: dist/release/
          if-no-files-found: error

      - name: Upload exact NanoHost amd64 qualification inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanohost-release-amd64
          path: |
            dist/release/openkit-nanohost-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error

      - name: Upload exact NanoHost arm64 qualification inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanohost-release-arm64
          path: |
            dist/release/openkit-nanohost-${{ github.ref_name }}-linux-arm64.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error

  qualify-nanohost:
    name: Qualify NanoHost on ${{ matrix.architecture }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package-release-assets
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download exact NanoHost archive and checksum
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nanohost-release-${{ matrix.architecture }}
          path: nanohost-release

      - name: Verify the exact target archive
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          verification_parent="$(mktemp -d)"
          node scripts/verify-nanohost-release.mjs \
            --archive "nanohost-release/openkit-nanohost-${GITHUB_REF_NAME}-linux-${ARCHITECTURE}.tar.gz" \
            --checksum-file nanohost-release/SHA256SUMS \
            --destdir "${verification_parent}/stage" \
            --repo-root .
          tar -xzf "nanohost-release/openkit-nanohost-${GITHUB_REF_NAME}-linux-${ARCHITECTURE}.tar.gz" -C nanohost-release

      - name: Provision missing declared inspection prerequisites
        run: |
          # Preparation precedes measured checks; the installer never repairs a failed observation.
          node --input-type=module <<'NODE' > prerequisite-packages.tsv
          import { readFileSync } from 'node:fs';
          import { parseNanoHostHostManifest } from './scripts/release-preflight.mjs';
          const profile = parseNanoHostHostManifest(readFileSync('apps/nanohost/deploy/host-manifest.json', 'utf8'));
          const packages = {
            '/usr/bin/containerd': 'containerd.io',
            '/usr/bin/dockerd': 'docker-ce',
            '/usr/bin/docker': 'docker-ce-cli',
            '/usr/bin/git': 'git',
            '/usr/bin/slirp4netns': 'slirp4netns',
          };
          for (const requirement of profile.requirements) {
            if (requirement.probe === 'executable') {
              const path = requirement.predicate.path;
              if (!packages[path]) throw new Error(`No hosted prerequisite package for ${path}`);
              console.log(`${path}\t${packages[path]}`);
            }
          }
          // Python is the owner's bootstrap prerequisite, outside the profile's probe entries.
          console.log('/usr/bin/python3\tpython3');
          console.log('/usr/bin/systemd-analyze\tsystemd');
          console.log('/run/systemd/resolve/resolv.conf\tsystemd-resolved');
          NODE
          [ -n "${ImageOS:-}" ] && [ -n "${ImageVersion:-}" ]
          missing=()
          while IFS=$'\t' read -r path package; do
            if [ ! -e "${path}" ] && [ ! -L "${path}" ]; then missing+=("${package}"); fi
          done < prerequisite-packages.tsv
          {
            echo "### NanoHost qualification image"
            echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
            echo "### Installed prerequisite package versions"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${#missing[@]}" -gt 0 ]; then
            dpkg-query -W -f='${binary:Package}=${Version}\n' | sort > packages-before.txt
            sudo apt-get update
            set +e
            sudo apt-get install -y "${missing[@]}"
            provision_status=$?
            set -e
            dpkg-query -W -f='${binary:Package}=${Version}\n' | sort > packages-after.txt
            comm -13 packages-before.txt packages-after.txt >> "${GITHUB_STEP_SUMMARY}"
            [ "${provision_status}" -eq 0 ]
          else
            echo "No missing prerequisite packages." >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo "### Observed prerequisite package versions" >> "${GITHUB_STEP_SUMMARY}"
          cut -f2 prerequisite-packages.tsv | sort -u | while IFS= read -r package; do
            dpkg-query -W -f='${Package}=${Version}\n' "${package}"
          done >> "${GITHUB_STEP_SUMMARY}"

      - name: Check real host and no-write installation disposition
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          bundle="${GITHUB_WORKSPACE}/nanohost-release/openkit-nanohost-${GITHUB_REF_NAME}-linux-${ARCHITECTURE}"
          # Snapshot all fixed live and reserved paths, including inode, mode, and bytes.
          snapshot() {
            sudo /usr/bin/python3 -I -B - <<'PY_SNAPSHOT'
          import hashlib, json, os, stat
          paths = ['/usr/lib/openkit/nanohost', '/usr/lib/openkit/openshell-gateway', '/etc/systemd/system/openkit-nanohost.service', '/usr/lib/openkit/.nanohost.openkit-install', '/usr/lib/openkit/.openshell-gateway.openkit-install', '/etc/systemd/system/.openkit-nanohost.service.openkit-install']
          result = []
          for path in paths:
              try:
                  info = os.lstat(path)
              except FileNotFoundError:
                  result.append([path, 'absent'])
                  continue
              digest = None
              if stat.S_ISREG(info.st_mode):
                  with open(path, 'rb') as source:
                      digest = hashlib.sha256(source.read()).hexdigest()
              result.append([path, info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid, info.st_size, info.st_mtime_ns, digest, os.readlink(path) if stat.S_ISLNK(info.st_mode) else None])
          print(json.dumps(result, separators=(',', ':')))
          PY_SNAPSHOT
          }
          snapshot > nanohost-release/live-before.json
          set +e
          sudo sh "${bundle}/install.sh" --check-host > nanohost-release/check-host.json
          host_status=$?
          sudo sh "${bundle}/install.sh" --check > nanohost-release/check-install.txt
          disposition_status=$?
          set -e
          snapshot > nanohost-release/live-after.json
          cmp nanohost-release/live-before.json nanohost-release/live-after.json
          cat nanohost-release/check-host.json nanohost-release/check-install.txt >> "${GITHUB_STEP_SUMMARY}"
          [ "${host_status}" -eq 0 ]
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const result = JSON.parse(readFileSync('nanohost-release/check-host.json', 'utf8'));
          assert.equal(result.hardVerdict, 'requirements-met');
          assert.equal(result.productCommit, process.env.GITHUB_SHA);
          const manifest = JSON.parse(readFileSync(`nanohost-release/openkit-nanohost-${process.env.GITHUB_REF_NAME}-linux-${process.env.ARCHITECTURE}/MANIFEST.json`, 'utf8'));
          assert.equal(result.profileDigest, manifest.profileDigest);
          const checksum = readFileSync('nanohost-release/SHA256SUMS', 'utf8').split('\n').find((line) => line.endsWith(`  openkit-nanohost-${process.env.GITHUB_REF_NAME}-linux-${process.env.ARCHITECTURE}.tar.gz`));
          assert.equal(result.archiveSha256, checksum?.slice(0, 64));
          NODE
          [ "${disposition_status}" -eq 0 ]
          grep -Fx 'host-prerequisites=pass' nanohost-release/check-install.txt
          grep -Fx 'destination=installable' nanohost-release/check-install.txt

      - name: Stage the qualified archive without service effects
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          bundle="${GITHUB_WORKSPACE}/nanohost-release/openkit-nanohost-${GITHUB_REF_NAME}-linux-${ARCHITECTURE}"
          staging_parent="$(mktemp -d)"
          DESTDIR="${staging_parent}/stage" sh "${bundle}/install.sh" > nanohost-release/staging.txt
          grep -Fx 'staged-only' nanohost-release/staging.txt
          for binary in nanohost openshell-gateway; do
            cmp "${bundle}/${binary}" "${staging_parent}/stage/usr/lib/openkit/${binary}"
            [ "$(stat -c '%a' "${staging_parent}/stage/usr/lib/openkit/${binary}")" = 755 ]
          done
          cmp "${bundle}/openkit-nanohost.service" "${staging_parent}/stage/etc/systemd/system/openkit-nanohost.service"
          [ "$(stat -c '%a' "${staging_parent}/stage/etc/systemd/system/openkit-nanohost.service")" = 644 ]
          cat nanohost-release/staging.txt >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain NanoHost qualification observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanohost-qualification-${{ matrix.architecture }}
          path: |
            nanohost-release/staging.txt
            nanohost-release/check-host.json
            nanohost-release/check-install.txt
            nanohost-release/live-before.json
            nanohost-release/live-after.json
          if-no-files-found: warn

  container-image-matrix:
    name: Container image release matrix
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["release-gate","full"]'), inputs.gate))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      worker-matrix: ${{ steps.matrix.outputs.worker-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read release image manifest
        id: matrix
        run: |
          node <<'NODE' >> "${GITHUB_OUTPUT}"
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('containers/images.json', 'utf8'));
          const images = manifest.images
            .filter((image) => image.release === true)
            .map((image) => ({
              id: image.id,
              repository: image.repository,
              dockerfile: image.dockerfile,
              context: image.context,
              kind: image.kind,
              platforms: image.platforms.join(','),
              runtimes: (image.runtimes || []).join(','),
              target: image.target || '',
              workerContract: image.workerContract || '',
              smokeCommand: image.smokeCommand,
              anonymousPull: image.anonymousPull === true,
              localTag: image.localTag,
            }));
          if (images.length === 0) {
            throw new Error('containers/images.json does not declare release images.');
          }
          process.stdout.write(`matrix=${JSON.stringify({ include: images })}\n`);
          const workerImages = images
            .filter((image) => image.kind === 'worker')
            .flatMap((image) => image.platforms.split(',').map((platform) => ({
              ...image,
              platform,
              runner: platform === 'linux/arm64' ? 'ubuntu-24.04-arm' : 'ubuntu-24.04',
            })));
          process.stdout.write(`worker-matrix=${JSON.stringify({ include: workerImages })}\n`);
          NODE

  candidate-plan:
    name: Prerelease candidate inputs
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["release-gate","full"]'), inputs.gate))
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select the committed intended prerelease
        id: plan
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: node scripts/release-candidate.mjs select --tag "${CANDIDATE_TAG}" >> "${GITHUB_OUTPUT}"

  candidate-images:
    name: ${{ matrix.jobName }}
    if: needs.candidate-plan.outputs.enabled == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["release-gate","full"]'), inputs.gate)))
    needs: candidate-plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the exact-P intended image identity
        id: image
        env:
          IMAGE_ID: ${{ matrix.id }}
          CANDIDATE_TAG: ${{ needs.candidate-plan.outputs.tag }}
        run: node scripts/release-candidate.mjs identity --id "${IMAGE_ID}" --tag "${CANDIDATE_TAG}" >> "${GITHUB_OUTPUT}"
      - name: Build one native digest-only candidate
        id: candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.image.outputs.args }}
          labels: ${{ steps.image.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=release-candidate-${{ matrix.id }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=release-candidate-${{ matrix.id }}-${{ matrix.architecture }}
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Smoke and record the exact registry platform digest
        env:
          IMAGE_ID: ${{ matrix.id }}
          CANDIDATE_TAG: ${{ needs.candidate-plan.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: node scripts/release-candidate.mjs platform --id "${IMAGE_ID}" --tag "${CANDIDATE_TAG}" --platform "${PLATFORM}" --digest "${DIGEST}" --directory temp/candidate-platforms
      - name: Retain exact-P platform observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-platform-${{ matrix.id }}-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: temp/candidate-platforms/
          if-no-files-found: error
          retention-days: 14

  candidate-index:
    name: Candidate index (${{ matrix.id }})
    if: needs.candidate-plan.outputs.enabled == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["release-gate","full"]'), inputs.gate)))
    needs: [candidate-plan, candidate-images, container-image-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.container-image-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download this attempt's platform observations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-platform-${{ matrix.id }}-*-${{ github.run_attempt }}
          merge-multiple: true
          path: temp/candidate-platforms
      - name: Assemble an index under a candidate-only reference
        env:
          IMAGE_ID: ${{ matrix.id }}
          CANDIDATE_TAG: ${{ needs.candidate-plan.outputs.tag }}
        run: node scripts/release-candidate.mjs index --id "${IMAGE_ID}" --tag "${CANDIDATE_TAG}" --directory temp/candidate-platforms
      - name: Retain the immutable candidate index record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.id }}-${{ github.run_attempt }}
          path: temp/candidate-platforms/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 14

  smoke-worker-images:
    name: Smoke ${{ matrix.id }} (${{ matrix.platform }})
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["release-gate","full"]'), inputs.gate))) && needs.candidate-plan.outputs.enabled != 'true'
    needs: [container-image-matrix, candidate-plan]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.container-image-matrix.outputs.worker-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          tags: ${{ matrix.localTag }}
          load: true
          push: false
          cache-from: type=gha,scope=worker-smoke-${{ matrix.id }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=worker-smoke-${{ matrix.id }}-${{ runner.arch }}

      - name: Run worker image smoke
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
          IMAGE_ID: ${{ matrix.id }}
        run: bash scripts/docker/smoke-image.sh "${IMAGE_ID}"

  publish-container-images:
    name: Publish ${{ matrix.id }} image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - release-preflight
      - l0-l2
      - nano-core-e2e
      - smoke
      - workspace-portability-target
      - container-image-matrix
      - qualify-nanohost
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.container-image-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute deterministic image identity
        id: image
        env:
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_KIND: ${{ matrix.kind }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          WORKER_CONTRACT: ${{ matrix.workerContract }}
          WORKER_RUNTIMES: ${{ matrix.runtimes }}
        run: |
          created="$(git show -s --format=%cI "${GITHUB_SHA}")"
          CREATED="${created}" node <<'NODE' >> "${GITHUB_OUTPUT}"
          const owner = process.env.GITHUB_REPOSITORY_OWNER.toLowerCase();
          const repository = process.env.IMAGE_REPOSITORY;
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const image = `ghcr.io/${owner}/${repository}`;
          const shortSha = process.env.GITHUB_SHA.slice(0, 12);
          const tags = [
            `${image}:${process.env.GITHUB_REF_NAME}`,
            `${image}:${version}`,
            `${image}:sha-${shortSha}`,
          ];
          const prerelease = version.includes('-');
          if (!prerelease) {
            tags.push(`${image}:latest`);
          }
          const labels = [
            `org.opencontainers.image.title=${repository}`,
            `org.opencontainers.image.description=OpenKit ${process.env.IMAGE_ID} release image`,
            `org.opencontainers.image.source=${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`,
            `org.opencontainers.image.revision=${process.env.GITHUB_SHA}`,
            `org.opencontainers.image.version=${version}`,
            `org.opencontainers.image.created=${process.env.CREATED}`,
            'org.opencontainers.image.licenses=Apache-2.0',
            `org.openkit.image.id=${process.env.IMAGE_ID}`,
            `org.openkit.image.kind=${process.env.IMAGE_KIND}`,
          ];
          if (process.env.WORKER_RUNTIMES) {
            labels.push(`org.openkit.worker.runtimes=${process.env.WORKER_RUNTIMES}`);
          }
          if (process.env.WORKER_CONTRACT) {
            labels.push(`org.openkit.worker.contract=${process.env.WORKER_CONTRACT}`);
          }
          process.stdout.write(`image=${image}\n`);
          process.stdout.write(`version=${version}\n`);
          process.stdout.write(`prerelease=${prerelease}\n`);
          process.stdout.write(`version_tag=${tags[0]}\n`);
          process.stdout.write(`version_without_v_tag=${tags[1]}\n`);
          process.stdout.write(`sha_tag=${tags[2]}\n`);
          process.stdout.write(`latest_tag=${image}:latest\n`);
          process.stdout.write('tags<<EOF\n');
          process.stdout.write(`${tags.join('\n')}\n`);
          process.stdout.write('EOF\n');
          process.stdout.write('labels<<EOF\n');
          process.stdout.write(`${labels.join('\n')}\n`);
          process.stdout.write('EOF\n');
          NODE

      - name: Inspect existing immutable identity
        id: existing
        env:
          LATEST_TAG: ${{ steps.image.outputs.latest_tag }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
          VERSION_WITHOUT_V_TAG: ${{ steps.image.outputs.version_without_v_tag }}
        run: |
          node scripts/release-image-state.mjs \
            --version-tag "${VERSION_TAG}" \
            --version-without-v-tag "${VERSION_WITHOUT_V_TAG}" \
            --sha-tag "${SHA_TAG}" \
            --latest-tag "${LATEST_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Resolve the proved exact-P candidate digest
        id: release
        env:
          IMAGE_ID: ${{ matrix.id }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PRESENT: ${{ steps.existing.outputs.present }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${PRESENT}" = "true" ]; then
            echo "digest=${EXISTING_DIGEST}" >> "${GITHUB_OUTPUT}"
            echo "reused=true" >> "${GITHUB_OUTPUT}"
          else
            node scripts/release-candidate.mjs fetch --id "${IMAGE_ID}" --tag "${GITHUB_REF_NAME}" --directory "temp/candidate-${IMAGE_ID}" >> "${GITHUB_OUTPUT}"
            echo "reused=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Promote the smoked digest
        if: steps.existing.outputs.present == 'false'
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
          PRERELEASE: ${{ steps.image.outputs.prerelease }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
          VERSION_WITHOUT_V_TAG: ${{ steps.image.outputs.version_without_v_tag }}
        run: |
          tags=(--tag "${VERSION_TAG}" --tag "${VERSION_WITHOUT_V_TAG}" --tag "${SHA_TAG}")
          if [ "${PRERELEASE}" = "false" ]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${DIGEST}"

      - name: Verify promoted identity
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          LATEST_BEFORE: ${{ steps.existing.outputs.latest_before }}
          LATEST_TAG: ${{ steps.image.outputs.latest_tag }}
          PRERELEASE: ${{ steps.image.outputs.prerelease }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
          VERSION_WITHOUT_V_TAG: ${{ steps.image.outputs.version_without_v_tag }}
        run: |
          node scripts/release-image-state.mjs \
            --version-tag "${VERSION_TAG}" \
            --version-without-v-tag "${VERSION_WITHOUT_V_TAG}" \
            --sha-tag "${SHA_TAG}" \
            --latest-tag "${LATEST_TAG}" > release-image-state-after.txt
          grep -Fx "present=true" release-image-state-after.txt
          grep -Fx "digest=${DIGEST}" release-image-state-after.txt
          latest_after="$(sed -n 's/^latest_before=//p' release-image-state-after.txt)"
          if [ "${PRERELEASE}" = "true" ]; then
            [ "${latest_after}" = "${LATEST_BEFORE}" ] || { echo "Prerelease changed latest." >&2; exit 1; }
          else
            [ "${latest_after}" = "${DIGEST}" ] || { echo "Stable release did not promote latest." >&2; exit 1; }
          fi

      - name: Verify public worker base anonymous pull
        if: matrix.anonymousPull
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

      - name: Write image release record
        env:
          ANONYMOUS_PULL: ${{ matrix.anonymousPull }}
          DIGEST: ${{ steps.release.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          PLATFORMS: ${{ matrix.platforms }}
          PRERELEASE: ${{ steps.image.outputs.prerelease }}
          REUSED: ${{ steps.release.outputs.reused }}
        run: |
          mkdir -p release-records
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const image = process.env.IMAGE;
          const digest = process.env.DIGEST;
          const imageId = process.env.IMAGE_ID;
          const raw = execFileSync(
            'docker',
            ['buildx', 'imagetools', 'inspect', '--raw', `${image}@${digest}`],
            { encoding: 'utf8' },
          );
          const index = JSON.parse(raw);
          const manifests = Array.isArray(index.manifests) ? index.manifests : [];
          const platforms = process.env.PLATFORMS.split(',').filter(Boolean).map((platform) => {
            const separator = platform.indexOf('/');
            const os = platform.slice(0, separator);
            const architecture = platform.slice(separator + 1);
            const matches = manifests.filter(
              (item) =>
                item?.platform?.os === os &&
                item?.platform?.architecture === architecture &&
                typeof item.digest === 'string',
            );
            if (matches.length !== 1) {
              throw new Error(`Index for ${imageId} has ${matches.length} manifests for ${platform}.`);
            }
            return { platform, digest: matches[0].digest };
          });
          platforms.sort((left, right) => left.platform.localeCompare(right.platform));
          const tags = process.env.IMAGE_TAGS.split('\n').filter(Boolean);
          const lines = [
            `### ${imageId}`,
            '',
            `- Image: \`${image}\``,
            `- Digest: \`${digest}\``,
            ...platforms.map(
              (entry) => `- Platform manifest \`${entry.platform}\`: \`${entry.digest}\``,
            ),
            `- Reused immutable release identity: \`${process.env.REUSED}\``,
            '- Tags:',
            ...tags.map((tag) => `  - \`${tag}\``),
          ];
          fs.writeFileSync(`release-records/${imageId}.md`, `${lines.join('\n')}\n`);
          fs.writeFileSync(
            `release-records/${imageId}.json`,
            `${JSON.stringify(
              {
                id: imageId,
                image,
                digest,
                anonymousPull: process.env.ANONYMOUS_PULL === 'true',
                prerelease: process.env.PRERELEASE === 'true',
                reused: process.env.REUSED === 'true',
                tags,
                platforms,
              },
              null,
              2,
            )}\n`,
          );
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, fs.readFileSync(`release-records/${imageId}.md`));
          NODE

      - name: Upload image release record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-${{ matrix.id }}
          path: release-records/
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - package-release-assets
      - qualify-nanohost
      - publish-container-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download image release records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-image-*
          path: release-records
          merge-multiple: true

      - name: Download portable release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-portable-assets
          path: portable-assets

      - name: Create release notes
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          visibility=public
          if [ "${REPOSITORY_PRIVATE}" = "true" ]; then visibility=private; fi
          checksum="$(sha256sum portable-assets/SHA256SUMS | cut -d ' ' -f1)"
          node scripts/release-notes.mjs \
            --repo-root . \
            --tag "${GITHUB_REF_NAME}" \
            --records release-records \
            --checksum "${checksum}" \
            --visibility "${visibility}" \
            --sha "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output release-notes.md

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            draft="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            [ "${draft}" = "false" ] || { echo "Existing draft release requires operator inspection." >&2; exit 1; }
            echo "Existing published GitHub Release is immutable; continuing to verification."
            exit 0
          fi
          release_flags=(--verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "portable-assets/openkit-ops-skill-${GITHUB_REF_NAME}.tar.gz" \
            "portable-assets/openkit-nanohost-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
            "portable-assets/openkit-nanohost-${GITHUB_REF_NAME}-linux-arm64.tar.gz" \
            portable-assets/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            "${release_flags[@]}"

  verify-release:
    name: Verify published release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - test-image
      - github-release
      - publish-container-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image release records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-image-*
          path: release-records
          merge-multiple: true

      - name: Verify every published image digest
        run: |
          node <<'NODE' > release-records.tsv
          const fs = require('node:fs');
          const path = require('node:path');
          for (const name of fs.readdirSync('release-records').filter((name) => name.endsWith('.json')).sort()) {
            const record = JSON.parse(fs.readFileSync(path.join('release-records', name), 'utf8'));
            process.stdout.write(`${record.id}\t${record.image}\t${record.digest}\n`);
          }
          NODE
          resolve_digest() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'
          }
          version="${GITHUB_REF_NAME#v}"
          short_sha="${GITHUB_SHA:0:12}"
          while IFS=$'\t' read -r id image digest; do
            for tag in "${GITHUB_REF_NAME}" "${version}" "sha-${short_sha}"; do
              [ "$(resolve_digest "${image}:${tag}")" = "${digest}" ] || { echo "Post-publish mismatch for ${id}:${tag}." >&2; exit 1; }
            done
            if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
              [ "$(resolve_digest "${image}:latest")" = "${digest}" ] || { echo "Post-publish latest mismatch for ${id}." >&2; exit 1; }
            fi
          done < release-records.tsv

      - name: Download and verify GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          TEST_IMAGE: ${{ needs.test-image.outputs.image }}
        run: |
          release_json="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,isPrerelease,assets,body)"
          mkdir release-download
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-download
          checksum="$(sha256sum release-download/SHA256SUMS | cut -d ' ' -f1)"
          visibility=public
          if [ "${REPOSITORY_PRIVATE}" = "true" ]; then visibility=private; fi
          RELEASE_JSON="${release_json}" node <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(process.env.RELEASE_JSON);
          const expectedPrerelease = process.env.GITHUB_REF_NAME.includes('-');
          const names = release.assets.map((asset) => asset.name).sort();
          const expected = [
            'SHA256SUMS',
            `openkit-ops-skill-${process.env.GITHUB_REF_NAME}.tar.gz`,
            `openkit-nanohost-${process.env.GITHUB_REF_NAME}-linux-amd64.tar.gz`,
            `openkit-nanohost-${process.env.GITHUB_REF_NAME}-linux-arm64.tar.gz`,
          ].sort();
          if (release.tagName !== process.env.GITHUB_REF_NAME || release.isDraft || release.isPrerelease !== expectedPrerelease) {
            throw new Error('GitHub Release identity or state does not match the tag.');
          }
          if (JSON.stringify(names) !== JSON.stringify(expected)) {
            throw new Error(`GitHub Release assets differ: ${names.join(', ')}`);
          }
          fs.writeFileSync('release-body.md', String(release.body ?? ''));
          NODE
          node scripts/release-notes.mjs \
            --repo-root . \
            --tag "${GITHUB_REF_NAME}" \
            --records release-records \
            --checksum "${checksum}" \
            --visibility "${visibility}" \
            --sha "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --compare-body release-body.md
          # Docker and gh stay on the host; deterministic asset checks use the authoritative image.
          docker run --rm --init --interactive \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env GITHUB_REF_NAME \
            "${TEST_IMAGE}" bash -euo pipefail <<'VERIFY_ASSETS'
          pnpm install --frozen-lockfile
          (cd release-download && sha256sum -c SHA256SUMS)
          ops_archive="release-download/openkit-ops-skill-${GITHUB_REF_NAME}.tar.gz"
          ops_prefix="openkit-ops-skill-${GITHUB_REF_NAME}"
          tar -tzf "${ops_archive}" | grep -Fx "${ops_prefix}/LICENSE"
          tar -tzf "${ops_archive}" | grep -Fx "${ops_prefix}/skills/openkit-ops/SKILL.md"
          tar -tzf "${ops_archive}" | grep -Fx "${ops_prefix}/skills/openkit-ops/scripts/openkit"
          ops_extract="$(mktemp -d)"
          OPS_ARCHIVE="${ops_archive}" OPS_EXTRACT="${ops_extract}" node --input-type=module <<'NODE'
          import { verifyOperationsSkillArchive } from './scripts/package-release-assets.mjs';
          verifyOperationsSkillArchive({
            archivePath: process.env.OPS_ARCHIVE,
            destDir: process.env.OPS_EXTRACT,
          });
          NODE
          verification_parent="$(mktemp -d)"
          for architecture in amd64 arm64; do
            node scripts/verify-nanohost-release.mjs \
              --archive "release-download/openkit-nanohost-${GITHUB_REF_NAME}-linux-${architecture}.tar.gz" \
              --checksum-file release-download/SHA256SUMS \
              --destdir "${verification_parent}/${architecture}" \
              --repo-root .
          done
          VERIFY_ASSETS

      - name: Verify public worker base without registry credentials
        run: |
          common="$(node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const records = fs.readdirSync('release-records')
            .filter((name) => name.endsWith('.json'))
            .map((name) => JSON.parse(fs.readFileSync(path.join('release-records', name), 'utf8')))
            .filter((record) => record.anonymousPull === true);
          if (records.length !== 1) throw new Error(`Expected one anonymous-pull image record, found ${records.length}.`);
          process.stdout.write(`${records[0].image}@${records[0].digest}`);
          NODE
          )"
          docker logout ghcr.io
          docker buildx imagetools inspect "${common}"
