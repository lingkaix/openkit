name: Stable promotion

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-*'

permissions: {}

concurrency:
  group: openkit-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified prerelease without rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stable-release
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - name: Require exact engineer authority or bounded scratch rehearsal
        env:
          REPOSITORY: ${{ github.repository }}
          FORK: ${{ github.event.repository.fork }}
          OPENKIT_STABLE_PROMOTION: ${{ vars.OPENKIT_STABLE_PROMOTION }}
        run: |
          [ "${FORK}" = false ] || exit 1
          case "${REPOSITORY}" in
            notrucked/openkit) ;;
            lingkaix/openkit)
              [ "${OPENKIT_STABLE_PROMOTION}" = "${GITHUB_REF_NAME}@${GITHUB_SHA}" ] || {
                echo 'Stable publication needs exact engineer authorization after all stable prerequisites pass.' >&2
                exit 1
              } ;;
            *) exit 1 ;;
          esac

      - name: Checkout exact promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          install: true

      - name: Lint workflows before registry credentials are available
        run: |
          node scripts/install-security-tools.mjs --tool zizmor --directory "${RUNNER_TEMP}/security-tools"
          PATH="${RUNNER_TEMP}/security-tools:${PATH}" node scripts/check-workflows.mjs --all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to release packages
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install verifier dependencies without building assets
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Promote and verify exact published bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENKIT_STABLE_PROMOTION: ${{ vars.OPENKIT_STABLE_PROMOTION }}
        run: |
          node scripts/release-promotion.mjs \
            --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" \
            --sha "${GITHUB_SHA}" --output "${RUNNER_TEMP}/promotion"

      - name: Retain promotion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-promotion-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/promotion/plan.json
            ${{ runner.temp }}/promotion/verified.json
          if-no-files-found: warn
