name: Stable promotion

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-*'

permissions: {}

concurrency:
  group: openkit-release
  cancel-in-progress: false

jobs:
  finding-admission:
    name: Admit unchanged published source findings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: stable-release
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    steps:
      - name: Checkout exact promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          install: true
      - name: Install checksum-bound security tools
        run: |
          node scripts/install-security-tools.mjs --tool zizmor --directory "${RUNNER_TEMP}/security-tools"
          node scripts/install-security-tools.mjs --tool osv-scanner --directory "${RUNNER_TEMP}/security-tools"
          echo "${RUNNER_TEMP}/security-tools" >> "${GITHUB_PATH}"
      - name: Lint before registry credentials
        run: node scripts/check-workflows.mjs --all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read-only package login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install verifier dependencies without building assets
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Observe the existing same-commit source without publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENKIT_STABLE_PROMOTION: ${{ vars.OPENKIT_STABLE_PROMOTION }}
        run: |
          node scripts/release-promotion.mjs --check-only --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" --sha "${GITHUB_SHA}" --output "${RUNNER_TEMP}/security-promotion"
      - name: Verify the unchanged source SBOMs and prerelease provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_ASSETS: ${{ runner.temp }}/security-promotion/source
        run: |
          source_tag="$(node --input-type=module -e 'import {publishedImages} from "./scripts/release-security.mjs"; console.log(publishedImages({directory:process.env.SOURCE_ASSETS,repoRoot:process.cwd(),repository:process.env.GITHUB_REPOSITORY,sha:process.env.GITHUB_SHA}).tag)')"
          node scripts/verify-release-integrity.mjs --directory "${SOURCE_ASSETS}" --repository "${GITHUB_REPOSITORY}" --tag "${source_tag}" --sha "${GITHUB_SHA}"
      - name: Admit source locks and every published platform digest
        env:
          OPENKIT_SECURITY_FINDINGS: ${{ secrets.OPENKIT_SECURITY_FINDINGS }}
        run: |
          node scripts/release-security.mjs --directory "${RUNNER_TEMP}/security-promotion/source" --repository "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" --repo-root . --output "${RUNNER_TEMP}/security-manifest.json" --public-record "${RUNNER_TEMP}/security-promotion.md"
      - name: Retain the exact admitted existing manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-promotion-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-manifest.json
            ${{ runner.temp }}/security-promotion.md
          if-no-files-found: error

  promote:
    name: Promote verified prerelease without rebuild
    needs: finding-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stable-release
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Require exact engineer authority or bounded scratch rehearsal
        env:
          REPOSITORY: ${{ github.repository }}
          FORK: ${{ github.event.repository.fork }}
          OPENKIT_STABLE_PROMOTION: ${{ vars.OPENKIT_STABLE_PROMOTION }}
        run: |
          [ "${FORK}" = false ] || exit 1
          case "${REPOSITORY}" in
            notrucked/openkit) ;;
            lingkaix/openkit)
              [ "${OPENKIT_STABLE_PROMOTION}" = "${GITHUB_REF_NAME}@${GITHUB_SHA}" ] || {
                echo 'Stable publication needs exact engineer authorization after all stable prerequisites pass.' >&2
                exit 1
              } ;;
            *) exit 1 ;;
          esac

      - name: Checkout exact promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          install: true

      - name: Lint workflows before registry credentials are available
        run: |
          node scripts/install-security-tools.mjs --tool zizmor --directory "${RUNNER_TEMP}/security-tools"
          PATH="${RUNNER_TEMP}/security-tools:${PATH}" node scripts/check-workflows.mjs --all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to release packages
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install verifier dependencies without building assets
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the exact finding-admitted source manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: security-promotion-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-admitted

      - name: Prepare unchanged verified source subjects without publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENKIT_STABLE_PROMOTION: ${{ vars.OPENKIT_STABLE_PROMOTION }}
        run: |
          node scripts/release-promotion.mjs --check-only --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" --sha "${GITHUB_SHA}" --output "${RUNNER_TEMP}/promotion-attestation" --security-manifest "${RUNNER_TEMP}/security-admitted/security-manifest.json"
          node scripts/release-sbom.mjs subjects --assets "${RUNNER_TEMP}/promotion-attestation/source" --repository "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" --output "${RUNNER_TEMP}/stable-provenance-subjects.txt"
      - name: Attest unchanged file and OCI index/platform subjects at the stable tag
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/stable-provenance-subjects.txt

      - name: Promote and verify exact published bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENKIT_STABLE_PROMOTION: ${{ vars.OPENKIT_STABLE_PROMOTION }}
        run: |
          node scripts/release-promotion.mjs \
            --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" \
            --sha "${GITHUB_SHA}" --output "${RUNNER_TEMP}/promotion" \
            --security-manifest "${RUNNER_TEMP}/security-admitted/security-manifest.json"

      - name: Verify stable SBOM bindings and GitHub-keyless provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-integrity.mjs --directory "${RUNNER_TEMP}/promotion/downloaded" --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" --sha "${GITHUB_SHA}"

      - name: Retain promotion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-promotion-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/promotion/plan.json
            ${{ runner.temp }}/promotion/verified.json
          if-no-files-found: warn
