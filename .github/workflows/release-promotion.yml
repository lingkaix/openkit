name: Stable promotion

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-*'

permissions: {}

concurrency:
  group: openkit-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified prerelease without rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - name: Require bounded scratch authority
        env:
          REPOSITORY: ${{ github.repository }}
          FORK: ${{ github.event.repository.fork }}
        run: |
          [ "${REPOSITORY}" = notrucked/openkit ] && [ "${FORK}" = false ] || {
            echo 'Production stable publication is reserved and R001 remains open.' >&2
            exit 1
          }

      - name: Checkout exact promoted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to scratch packages
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install verifier dependencies without building assets
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Promote and verify exact published bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-promotion.mjs \
            --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" \
            --sha "${GITHUB_SHA}" --output "${RUNNER_TEMP}/promotion"

      - name: Retain promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-promotion-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/promotion/plan.json
            ${{ runner.temp }}/promotion/verified.json
          if-no-files-found: warn
