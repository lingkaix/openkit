name: Scratch published App smoke

on:
  workflow_dispatch:
    inputs:
      control_sha:
        description: Reviewed immutable control revision C
        required: true
        type: string
      source_sha:
        description: Published scratch subject P
        required: true
        type: string
      tag:
        description: Already published scratch prerelease
        required: true
        type: string
      publication_run:
        description: Successful scratch tag publication run
        required: true
        type: string

permissions: {}

jobs:
  scratch-smoke:
    name: Published scratch amd64 retained-read smoke
    if: github.event_name == 'workflow_dispatch' && github.repository == 'notrucked/openkit' && github.event.repository.fork == false && github.sha == inputs.control_sha && github.workflow_sha == inputs.control_sha && github.ref == format('refs/heads/scratch/cadence-smoke/{0}', inputs.control_sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Checkout reviewed control C
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.control_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: node
          cache: false

      - name: Checkout published subject P separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare published inputs
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL: ${{ inputs.control_sha }}
          SOURCE: ${{ inputs.source_sha }}
          TAG: ${{ inputs.tag }}
          PUBLICATION: ${{ inputs.publication_run }}
        run: node scripts/release-scratch-smoke.mjs prepare --control "$CONTROL" --source "$SOURCE" --tag "$TAG" --publication "$PUBLICATION" --directory "${RUNNER_TEMP}/cadence-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Run credential-isolated fixture
        run: |
          cd subject
          env -i PATH="$PATH" HOME="${RUNNER_TEMP}/cadence-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/home" TMPDIR="${RUNNER_TEMP}/cadence-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            node "${GITHUB_WORKSPACE}/scripts/release-scratch-smoke.mjs" fixture \
            --directory "${RUNNER_TEMP}/cadence-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --subject "${GITHUB_WORKSPACE}/subject"

      - name: Confirm attempt cleanup
        if: always()
        run: |
          env -i PATH="$PATH" HOME="${RUNNER_TEMP}" TMPDIR="${RUNNER_TEMP}" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            node scripts/release-scratch-smoke.mjs cleanup --directory "${RUNNER_TEMP}/cadence-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Upload selected result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scratch-post-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cadence-smoke-${{ github.run_id }}-${{ github.run_attempt }}-result/result.json
          if-no-files-found: error
          retention-days: 14
