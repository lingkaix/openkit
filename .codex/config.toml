#:schema https://developers.openai.com/codex/config-schema.json
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
#service_tier = "fast"
sandbox_mode = "danger-full-access"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
[features]
goals = true
[tui]
notification_condition = "always"
[agents]
max_threads = 12

[agents.research]
description = "Research existing projects and produce or update reference reports for improving this repository. Use primary sources first, then use DeepWiki as a co-researcher to cross-check findings, compare interpretations, and reduce omissions."
config_file = "agents/researcher.toml"
nickname_candidates = ["Archivist", "Surveyor", "Analyst"]

[agents.builder]
description = "Implementation-focused project builder for making scoped code, test, documentation, and verification changes in this repository."
config_file = "agents/builder.toml"
nickname_candidates = ["Builder", "Implementer", "Integrator"]

[agents.reviewer]
description = "Codex review-mode project reviewer focused on correctness, regressions, security, tests, and repository-rule compliance."
config_file = "agents/reviewer.toml"
nickname_candidates = ["Reviewer", "Auditor", "Inspector"]

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]
