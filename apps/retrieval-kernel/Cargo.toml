[package]
name = "retrieval-kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
fs2 = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
libc = "0.2"
lindera = "=5.0.1"
lindera-tantivy = { version = "=5.0.1", features = ["embed-ipadic"] }
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "=0.26.2"
tantivy-jieba = "=0.21.0"

[dev-dependencies]
tempfile = "3"
