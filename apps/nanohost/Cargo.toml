[package]
name = "nanohost"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
h2 = "0.4"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
oci-client = { version = "=0.17.0", default-features = false, features = ["rustls-tls"] }
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell.git", rev = "8c7dd148a9e6360c9d5b2830e339a0dc4b3f3032" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
webpki-roots = "1"
