[tools]
node = "24"
pnpm = "latest"
bun = "latest"

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"

[tasks.hooks]
description = "Install tracked git hooks via Lefthook"
run = "pnpm run hooks:install"

[tasks.build]
description = "Build all workspace packages"
run = "pnpm build"

[tasks.test]
description = "Run all workspace tests"
run = "pnpm test"

[tasks.typecheck]
description = "Run all workspace type checks"
run = "pnpm typecheck"

[tasks.lint]
description = "Run lint tasks across the repository"
run = "pnpm lint"

[tasks.fmt]
description = "Run workspace format tasks"
run = "pnpm fmt"

[tasks.dev]
description = "Run workspace development tasks"
run = "pnpm dev"

[tasks.clean]
description = "Clean workspace build outputs"
run = "pnpm clean"

[tasks.verify]
description = "Run repository validation commands"
run = "pnpm verify"

[tasks.verify-release]
description = "Run the tag release gate without browser or story tests"
run = "pnpm -w verify:release"

[tasks.verify-full]
description = "Run the full local gate including browser and story tests"
run = "pnpm -w verify:full"
