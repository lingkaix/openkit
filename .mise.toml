# Bootstrap installer and version anchor only.
#
# Not a command entry point: repository commands are the `scripts` in root `package.json`,
# invoked as bare `pnpm ...` once the shims directory is on PATH.
# Not a CI or container dependency: `containers/` pins its own Node and pnpm and never reads
# this file, and `.github/workflows/ci.yml` takes both from the test execution image.
#
# Scope, maintenance procedure, and the mirrored-declaration rule: `docs/toolchain.md`.
[tools]
node = "24.16.0"
pnpm = "10.33.3"
biome = "2.5.3"
